services:
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: mworks
      POSTGRES_USER: mworks
      POSTGRES_PASSWORD: mworks_local_change_me
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mworks -d mworks"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mworks
      MINIO_ROOT_PASSWORD: mworks_minio_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_ENV: local
      CORS_ORIGINS: http://localhost:5173
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mworks
      DB_USER: mworks
      DB_PASSWORD: mworks_local_change_me
      DB_SSLMODE: ""
      JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/secrets/jwt_public.pem
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: mworks
      S3_ACCESS_KEY: mworks
      S3_SECRET_KEY: mworks_minio_change_me
      APP_PUBLIC_URL: http://localhost:5173
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/anthropic}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_MODEL_FAST: ${DEEPSEEK_MODEL_FAST:-deepseek-v4-flash}
      SCAN_REQUIRE_CLAMAV: "false"
      UPLOAD_MAX_BYTES: "20000000"
      VIDEO_RETAIN_DAYS: "90"
      NEAR_DUPE_JACCARD: "0.85"
      INTERVIEWER_TRIAL_TURNS: "8"
      INTERVIEWER_PAID_TURNS: "500"
      INTERVIEWER_TRIAL_DAYS: "14"
      INTERVIEWER_MAX_QUESTIONS: "6"
      CLAMD_HOST: ""
      CLAMD_PORT: "3310"
      DEMO_USER_EMAIL: henry@mworks.ng
      DEMO_USER_PASSWORD: ChangeMe1a!
    ports:
      - "8000:8000"
    volumes:
      - jwtkeys:/app/secrets

  job-ingest:
    build: .
    entrypoint: ["python", "-m", "app.worker_ingest"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mworks
      DB_USER: mworks
      DB_PASSWORD: mworks_local_change_me
      DB_SSLMODE: ""
      DEMO_USER_PASSWORD: ChangeMe1a!
      VIDEO_RETAIN_DAYS: "90"
      JOB_INGEST_ENABLED: "true"
      JOB_INGEST_INTERVAL_SEC: "30"
      JOB_INGEST_MAX_NEW: "40"
      # Public Greenhouse board slugs, not paid API tokens.
      JOB_INGEST_SOURCES: "greenhouse:anthropic,greenhouse:databricks,greenhouse:xai,greenhouse:scaleai,greenhouse:togetherai,greenhouse:dataiku,greenhouse:stripe,greenhouse:gitlab,greenhouse:cloudflare,greenhouse:mongodb,greenhouse:elastic,greenhouse:datadog,greenhouse:figma,greenhouse:vercel,greenhouse:okta,arbeitnow"
    healthcheck:
      disable: true

volumes:
  pgdata:
  miniodata:
  jwtkeys:
